  <text class="sub" x="1036" y="182" text-anchor="middle">I2C</text>
  <text class="sub" x="1036" y="206" text-anchor="middle">XSHUT</text>
  <rect x="20" y="98" width="130" height="64" rx="8" fill="#e8f5ee" stroke="#3f9f6b" stroke-width="2"/>
  <text class="h" x="85" y="126.5" text-anchor="middle">Celda 18650</text>
  <text class="sub" x="85" y="143.5" text-anchor="middle">3.0–4.2 V</text>
  <rect x="240" y="92" width="150" height="76" rx="8" fill="#e8f0fb" stroke="#2b5ea8" stroke-width="2"/>
  <text class="h" x="315" y="118" text-anchor="middle">TP4056</text>
  <text class="sub" x="315" y="135" text-anchor="middle">con protección</text>
  <text class="sub" x="315" y="152" text-anchor="middle">B± → OUT±</text>
  <rect x="555" y="102" width="80" height="56" rx="8" fill="#ffffff" stroke="#2d3440" stroke-width="2"/>
  <text class="h" x="595" y="135" text-anchor="middle">pin 5V</text>
  <rect x="685" y="102" width="115" height="56" rx="8" fill="#ffffff" stroke="#2d3440" stroke-width="2"/>
  <text class="h" x="742.5" y="126.5" text-anchor="middle">LDO</text>
  <text class="sub" x="742.5" y="143.5" text-anchor="middle">onboard</text>
  <rect x="880" y="98" width="110" height="174" rx="8" fill="#2d3440" stroke="#161a20" stroke-width="2"/>
  <text x="935" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32-C3</text>
  <text x="890" y="148" font-size="12" fill="#c9d1dc">3V3</text>
  <text x="890" y="251" font-size="12" font-weight="700" fill="#ffb366">GPIO3</text>
  <text x="890" y="266" font-size="12" fill="#c9d1dc">(ADC)</text>
  <rect x="1076" y="100" width="104" height="120" rx="8" fill="#e6ecf7" stroke="#23457a" stroke-width="2"/>
  <text class="h" x="1128" y="148" text-anchor="middle">TOF200C</text>
  <text class="sub" x="1128" y="165" text-anchor="middle">(VL53L0X)</text>
  <text class="sub" x="1128" y="182" text-anchor="middle">VIN = 3V3</text>
  <rect x="380" y="215" width="120" height="64" rx="8" fill="#fff6e8" stroke="#d98a00" stroke-width="2"/>
  <text class="h" x="440" y="243.5" text-anchor="middle">Divisor</text>
  <text class="sub" x="440" y="260.5" text-anchor="middle">R1 = R2 (1 MΩ)</text>
  <text class="sub" x="440" y="296" text-anchor="middle">R2 a GND</text>
  <circle cx="440" cy="130" r="5" fill="#d62828" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="830" cy="130" r="5" fill="#d62828" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="20" y="322" width="1160" height="62" rx="8" fill="#fff4e0" stroke="#e0a030" stroke-width="1.5"/>
  <text class="note" x="34" y="344"><tspan font-weight="700">LDO a verificar:</tspan> con un ME6211/SGM2212 (~0.2 V de caída) anda con toda la celda; con un AMS1117 (1.1 V) se apaga por debajo de ~4.4 V.</text>
  <text class="note" x="34" y="366">Medirlo bajando una fuente variable desde 4.2 V en el pin 5V. Plan B: HT7333 alimentando el riel 3V3 directo. GND común (OUT− → G) no dibujado.</text>
