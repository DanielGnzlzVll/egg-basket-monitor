<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d62828"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f07c00"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#2b2f36; }
    .h { font-size:15px; font-weight:700; fill:#2b2f36; }
    .sub { font-size:12px; fill:#6b7280; }
    .v { font-size:12.5px; font-weight:700; }
    .p { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .note { font-size:12.5px; fill:#5b3a00; }
  </style>
  <rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
  <text class="title" x="20" y="30">Cadena de alimentación</text>
  <rect x="530" y="72" width="472" height="238" rx="12" fill="#f3f5f8" stroke="#8b95a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="sub" x="544" y="298" font-weight="700">Placa ESP32-C3 SuperMini</text>
  <path class="p" d="M150,130 H238" stroke="#d62828" marker-end="url(#ar)"/>
  <text class="v" x="191" y="120" text-anchor="middle" fill="#d62828">3.0–4.2 V</text>
  <text class="sub" x="191" y="150" text-anchor="middle">B+ / B−</text>
  <path class="p" d="M390,130 H553" stroke="#d62828" marker-end="url(#ar)"/>
  <text class="v" x="470" y="120" text-anchor="middle" fill="#d62828">OUT+  3.0–4.2 V</text>
  <path class="p" d="M635,130 H683" stroke="#d62828" marker-end="url(#ar)"/>
  <path class="p" d="M800,130 H878" stroke="#d62828" marker-end="url(#ar)"/>
  <text class="v" x="855" y="120" text-anchor="middle" fill="#d62828">3.3 V</text>
  <path class="p" d="M830,130 V48 H1128 V98" stroke="#d62828" marker-end="url(#ar)"/>
  <text class="v" x="975" y="40" text-anchor="middle" fill="#d62828">riel 3V3 → VIN del sensor (3.3 V)</text>
  <path class="p" d="M440,130 V213" stroke="#d62828" marker-end="url(#ar)"/>
  <text class="v" x="432" y="180" text-anchor="end" fill="#d62828">3.0–4.2 V</text>
  <path class="p" d="M500,247 H878" stroke="#f07c00" marker-end="url(#ao)"/>
  <text class="v" x="700" y="239" text-anchor="middle" fill="#b35900">Vbat/2 · 1.5–2.1 V</text>
