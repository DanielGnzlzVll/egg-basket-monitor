  <text class="h" x="610" y="590">Notas</text>
  <text class="note" x="610" y="614" xml:space="preserve">• Número de GPIO = número serigrafiado: el pin “4” es GPIO4 (sin alias tipo D4).</text>
  <text class="note" x="610" y="634" xml:space="preserve">• TOF200C: el orden físico de los pines varía según el fabricante; guiarse por el nombre.</text>
  <text class="note" x="610" y="654" xml:space="preserve">• LDO de la placa: si es un AMS1117, se apaga por debajo de ~4.4 V. Medirlo;</text>
  <text class="note" x="610" y="674" xml:space="preserve">   plan B: un HT7333 alimentando el pin 3V3 directamente.</text>
  <text class="note" x="610" y="694" xml:space="preserve">• Divisor: sirve cualquier par de resistencias iguales (R1 = R2).</text>
</svg>
