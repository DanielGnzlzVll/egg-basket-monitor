<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <style>
    .box { fill:#f4f6f8; stroke:#2b2f36; stroke-width:2; rx:8; }
    .label { fill:#2b2f36; font-weight:600; }
    .pin { fill:#5b6270; font-size:12px; }
    .pin-hi { fill:#2b2f36; font-size:12px; font-weight:600; }
    .wire { stroke-width:2.5; fill:none; }
    .wire-label { font-size:11px; font-weight:600; }
    .w-pos { stroke:#c0392b; }
    .w-gnd { stroke:#1a1a1a; }
    .w-sda { stroke:#e6a700; }
    .w-scl { stroke:#2e8b57; }
    .w-xshut { stroke:#2266cc; }
    .w-adc { stroke:#d35400; }
    .i2c-group { fill:none; stroke:#e6a700; stroke-width:1.5; stroke-dasharray:5,4; rx:6; }
    .callout { fill:#fff8e6; stroke:#c9a227; stroke-width:1.5; rx:6; }
    .callout text { font-size:12.5px; fill:#5b4400; }
  </style>

  <!-- ================= CALLOUT: numeracion de pines ================= -->
  <rect class="callout" x="20" y="14" width="1040" height="46"/>
  <text x="34" y="32">
    Los numeros GPIOx de este diagrama son los mismos que trae serigrafiado el ESP32-C3 SuperMini junto a cada pin
  </text>
  <text x="34" y="48">
    (p. ej. el pin marcado "4" en la placa es GPIO4). No hay traduccion tipo D0/D1 como en otras placas Arduino/ESP8266.
  </text>

  <!-- ================= 18650 cell ================= -->
  <rect class="box" x="20" y="100" width="150" height="80"/>
  <text class="label" x="35" y="130">Celda 18650</text>
  <text class="pin" x="35" y="150">3.0 - 4.2 V</text>
  <text class="pin" x="35" y="166">B+ / B-</text>

  <!-- ================= TP4056 ================= -->
  <rect class="box" x="230" y="100" width="170" height="90"/>
  <text class="label" x="245" y="125">TP4056</text>
  <text class="pin" x="245" y="143">con proteccion</text>
  <text class="pin" x="245" y="159">(DW01A + FS8205A)</text>
  <text class="pin" x="245" y="178">OUT+ / OUT-</text>

  <!-- ================= ESP32-C3 SuperMini ================= -->
  <rect class="box" x="470" y="80" width="260" height="340"/>
  <text class="label" x="485" y="105">ESP32-C3 SuperMini</text>
  <text class="pin" x="485" y="125">pin 5V (a LDO onboard)</text>

  <!-- fila 3V3 -->
  <text class="pin-hi" x="485" y="205">Pin "3V3" (riel, no es GPIO)</text>
  <text class="pin" x="640" y="205">-&gt; alimentacion</text>

  <!-- fila GND -->
  <text class="pin-hi" x="485" y="231">Pin "G" (GND, no es GPIO)</text>

  <!-- fila SDA -->
  <text class="pin-hi" x="485" y="257">GPIO4  ("4" en la placa)</text>
  <text class="pin" x="640" y="257">-&gt; SDA</text>

  <!-- fila SCL -->
  <text class="pin-hi" x="485" y="283">GPIO5  ("5" en la placa)</text>
  <text class="pin" x="640" y="283">-&gt; SCL</text>

  <!-- fila XSHUT -->
  <text class="pin-hi" x="485" y="309">GPIO6  ("6" en la placa)</text>
  <text class="pin" x="640" y="309">-&gt; XSHUT</text>

  <!-- fila ADC bateria -->
  <text class="pin-hi" x="485" y="335">GPIO3  ("3" en la placa)</text>
  <text class="pin" x="640" y="335">-&gt; ADC bateria</text>

  <!-- filas integradas -->
  <text class="pin" x="485" y="365">GPIO9 ("9") -&gt; boton BOOT (integrado, sin cablear)</text>
  <text class="pin" x="485" y="385">GPIO8 ("8") -&gt; LED RGB (integrado, sin cablear)</text>

  <!-- ================= VL53L1X module ================= -->
  <!-- Filas alineadas exactamente con las mismas y que el bloque ESP32-C3 -->
  <rect class="box" x="850" y="150" width="210" height="200"/>
  <text class="label" x="865" y="175">VL53L1X (GY-53L1, 3.3V)</text>
  <text class="pin-hi" x="865" y="205">VCC (3V3)</text>
  <text class="pin-hi" x="865" y="231">GND</text>
  <text class="pin-hi" x="865" y="257">SDA</text>
  <text class="pin-hi" x="865" y="283">SCL</text>
  <text class="pin-hi" x="865" y="309">XSHUT</text>

  <!-- ================= Grupo bus I2C (resaltado) ================= -->
  <rect class="i2c-group" x="735" y="243" width="115" height="54"/>
  <text x="738" y="236" font-size="12" fill="#8a6d00" font-weight="700">Bus I2C</text>

  <!-- ================= Wires: cell -> TP4056 ================= -->
  <path class="wire w-pos" d="M170,120 H230"/>
  <path class="wire w-gnd" d="M170,160 H230"/>

  <!-- TP4056 -> ESP32 5V -->
  <path class="wire w-pos" d="M400,120 H470"/>
  <path class="wire w-gnd" d="M400,170 H440 V395 H470"/>

  <!-- TP4056 OUT -> divider top -->
  <path class="wire w-pos" d="M315,190 V300 H230"/>

  <!-- ================= Battery divider ================= -->
  <rect class="box" x="230" y="280" width="170" height="100"/>
  <text class="label" x="245" y="305">Divisor bateria (R1 = R2)</text>
  <text class="pin" x="245" y="325">R1 (a pin 5V/OUT+)</text>
  <text class="pin" x="245" y="345">R2 (a GND) - cualquier valor igual a R1</text>
  <text class="pin" x="245" y="365">nodo medio -&gt; GPIO3</text>

  <!-- divider -> GND -->
  <path class="wire w-gnd" d="M315,380 V420 H190 V170 H230"/>

  <!-- divider mid -> GPIO3 -->
  <path class="wire w-adc" d="M400,325 H440 V335 H470"/>

  <!-- ================= ESP32 <-> VL53L1X (filas alineadas) ================= -->
  <path class="wire w-pos" d="M730,201 H850"/>
  <text class="wire-label" x="745" y="196" fill="#c0392b">3V3</text>

  <path class="wire w-gnd" d="M730,227 H850"/>
  <text class="wire-label" x="745" y="222" fill="#1a1a1a">GND</text>

  <path class="wire w-sda" d="M730,253 H850"/>
  <text class="wire-label" x="745" y="248" fill="#8a6d00">SDA</text>

  <path class="wire w-scl" d="M730,279 H850"/>
  <text class="wire-label" x="745" y="274" fill="#1f6b45">SCL</text>

  <path class="wire w-xshut" d="M730,305 H850"/>
  <text class="wire-label" x="745" y="300" fill="#174a8a">XSHUT</text>

  <!-- ================= Legend ================= -->
  <g transform="translate(20,460)">
    <text x="0" y="0" font-weight="700" font-size="13">Leyenda de color</text>
    <line x1="0" y1="16" x2="30" y2="16" class="wire w-pos"/><text x="36" y="20" font-size="12">V+ / 3V3 / OUT+</text>
    <line x1="0" y1="36" x2="30" y2="36" class="wire w-gnd"/><text x="36" y="40" font-size="12">GND</text>
    <line x1="0" y1="56" x2="30" y2="56" class="wire w-sda"/><text x="36" y="60" font-size="12">SDA (I2C, bidireccional)</text>
    <line x1="0" y1="76" x2="30" y2="76" class="wire w-scl"/><text x="36" y="80" font-size="12">SCL (I2C, reloj generado por el ESP32)</text>
    <line x1="0" y1="96" x2="30" y2="96" class="wire w-xshut"/><text x="36" y="100" font-size="12">XSHUT (control, ESP32 -&gt; sensor)</text>
    <line x1="0" y1="116" x2="30" y2="116" class="wire w-adc"/><text x="36" y="120" font-size="12">Divisor -&gt; ADC bateria</text>
  </g>

  <text x="20" y="620" font-size="13" fill="#5b6270">
    Nota: verificar con fuente variable si el LDO del C3 SuperMini es de baja caida (ME6211/SGM2212)
  </text>
  <text x="20" y="640" font-size="13" fill="#5b6270">
    antes de confiar el pin 5V con 3.7-4.2V. Si es un AMS1117, alimentar 3V3 desde un HT7333 en su lugar.
  </text>
  <text x="20" y="665" font-size="13" fill="#5b6270">
    Ver docs/superpowers/specs/2026-09-04-egg-basket-monitor-design.md, seccion "Conexionado".
  </text>
</svg>
