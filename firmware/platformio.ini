; Egg Basket Monitor — ESP32-C3 SuperMini
; https://github.com/DanielGnzlzVll/egg-basket-monitor

[env:esp32-c3-supermini]
platform = espressif32
; No existe una entrada de board dedicada para los clones "C3 SuperMini" en
; la base de PlatformIO; esp32-c3-devkitm-1 es el board generico que la
; comunidad usa para esta placa (mismo chip, mismo layout de flash/USB-CDC).
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    pololu/VL53L0X @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
