<text x="350.0" y="339" text-anchor="middle" font-size="11" fill="#333">SHUT (XSHUT) → GP28</text>
<circle cx="238" cy="380" r="6" fill="#ffd54f" stroke="#5d4037"/>
<text x="226" y="384" text-anchor="end" font-size="12" font-weight="bold" fill="#fff">SCL</text>
<line x1="238" y1="380" x2="462" y2="380" stroke="#9e8a00" stroke-width="7" stroke-linecap="round"/>
<line x1="238" y1="380" x2="462" y2="380" stroke="#fdd835" stroke-width="5" stroke-linecap="round"/>
<text x="350.0" y="373" text-anchor="middle" font-size="11" fill="#333">SCL → GP27</text>
<circle cx="238" cy="414" r="6" fill="#ffd54f" stroke="#5d4037"/>
<text x="226" y="418" text-anchor="end" font-size="12" font-weight="bold" fill="#fff">SDA</text>
<line x1="238" y1="414" x2="462" y2="414" stroke="#1e88e5" stroke-width="5" stroke-linecap="round"/>
<text x="350.0" y="407" text-anchor="middle" font-size="11" fill="#333">SDA → GP26</text>
<circle cx="238" cy="448" r="6" fill="#ffd54f" stroke="#5d4037"/>
<text x="226" y="452" text-anchor="end" font-size="12" font-weight="bold" fill="#fff">INT</text>
<text x="226" y="470" text-anchor="end" font-size="10" fill="#e1bee7">(sin conectar)</text>
<text x="40" y="580" font-size="13" fill="#333">• Los cinco cables salen del mismo borde de la placa: GND, 3V3, GP28, GP27, GP26.</text>
<text x="40" y="602" font-size="13" fill="#333">• VIN a 3V3, no a 5V: los pull-ups de SDA/SCL del módulo van a VIN y con 5V meterían 5V en GP26/GP27.</text>
<text x="40" y="624" font-size="13" fill="#333">• El orden de pines del módulo varía según el fabricante: guíate por la serigrafía, no por la posición.</text>
<text x="40" y="646" font-size="13" fill="#333">• SHUT es opcional (el módulo suele traer pull-up); si no lo cableas pon XSHUT_PIN = None en main.py.</text>
</svg>
