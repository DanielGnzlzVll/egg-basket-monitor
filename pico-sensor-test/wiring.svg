<line x1="238" y1="278" x2="462" y2="278" stroke="#e53935" stroke-width="5" stroke-linecap="round"/>
<text x="350.0" y="271" text-anchor="middle" font-size="11" fill="#333">VIN → 3V3 (no a 5V)</text>
