<text x="226" y="248" text-anchor="end" font-size="12" font-weight="bold" fill="#fff">GND</text>
<line x1="238" y1="244" x2="462" y2="244" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="350.0" y="237" text-anchor="middle" font-size="11" fill="#333">GND → GND</text>
